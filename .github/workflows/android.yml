name: Petak Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach APKs to a GitHub Release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # GitHub's Ubuntu runners ship the Android SDK; only add the platform and build tools we compile against.
      - name: Android SDK packages
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Web build (minified, code-split)
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      # docs/RELEASE-SIGNING.md: one release key in four repository secrets signs every build, so each
      # version installs over the previous one. Without it the runner's debug key (new on every
      # runner) signs the APKs, and no build installs over another.
      - name: Restore and check the signing key
        if: env.KEYSTORE_BASE64 != ''
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # pasted text may carry line breaks or Windows line ends
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks" \
            || { echo "::error::KEYSTORE_BASE64 is not valid base64 (copy all of petak-release.b64)"; exit 1; }
          if [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ]; then
            echo "::error::KEYSTORE_PASSWORD and KEY_ALIAS secrets are needed with KEYSTORE_BASE64"; exit 1
          fi
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KS_PASS" -alias "$KS_ALIAS" > /dev/null \
            || { echo "::error::The signing key could not be opened: check KEYSTORE_PASSWORD and KEY_ALIAS (alias is usually petak)"; exit 1; }

      - name: Refuse to publish a release without the release key
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 == ''
        run: |
          echo "::error::Tag builds publish a release and need the release key (docs/RELEASE-SIGNING.md)"
          exit 1

      - name: Build debug and release APKs
        working-directory: android
        env:
          PETAK_KEYSTORE: ${{ env.KEYSTORE_BASE64 != '' && format('{0}/release.jks', runner.temp) || '' }}
          PETAK_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PETAK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PETAK_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p out
          V=$(node -p "require('./package.json').version")
          # universal APKs keep the plain names; per-ABI APKs get the ABI in the name
          cp android/app/build/outputs/apk/release/app-universal-release.apk "out/Petak-v$V.apk"
          cp android/app/build/outputs/apk/debug/app-universal-debug.apk "out/Petak-v$V-debug.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "android/app/build/outputs/apk/release/app-$abi-release.apk" "out/Petak-v$V-$abi.apk"
          done
          (cd out && sha256sum *.apk > SHA256SUMS.txt)
          ls -la out

      - name: Signature
        run: |
          V=$(node -p "require('./package.json').version")
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "out/Petak-v$V.apk" | tee out/SIGNING.txt
          "$APKSIGNER" verify --print-certs "out/Petak-v$V-debug.apk" | sed 's/^/debug APK: /' >> out/SIGNING.txt
          SHA=$(grep -m1 'SHA-256 digest' out/SIGNING.txt | sed 's/.*: //')
          {
            echo "## Signing"
            if [ -n "$KEYSTORE_BASE64" ]; then
              echo "Signed with the **release key** (repository secrets). Certificate SHA-256:"
              echo
              echo "\`$SHA\`"
              echo
              echo "This must be the same for every build: then each version installs over the previous one."
            else
              echo "> [!CAUTION]"
              echo "> **No release key** (KEYSTORE_BASE64 secret not set): these APKs are signed with this runner's"
              echo "> throwaway debug key ($SHA). They will not install over any other build. See docs/RELEASE-SIGNING.md."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No release key configured (KEYSTORE_BASE64 secret): APKs are signed with this runner's debug key and will not install over other builds."
          fi

      - name: Size report
        run: |
          node scripts/size-report.mjs --summary
          cp SIZE.md out/

      - uses: actions/upload-artifact@v4
        with:
          name: Petak-apks
          path: |
            out/*.apk
            out/SHA256SUMS.txt
            out/SIGNING.txt
            out/SIZE.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.apk
            out/SHA256SUMS.txt
            out/SIGNING.txt
            out/SIZE.md
          generate_release_notes: true

  # Real Android WebView on an emulator: gestures go through `adb shell input`,
  # state is read over WebView DevTools. Observes and reports; never blocks the APK.
  device:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@v5
        with:
          name: Petak-apks
          path: out

      - name: Test files
        run: |
          sudo apt-get install -y --no-install-recommends libreoffice-calc > /dev/null 2>&1 || true
          node tests/fixtures/make-fixtures.mjs

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 4096
          script: node tests/device/run-all.mjs out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test
          path: device-out
